services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: wetext
      POSTGRES_USER: wetext
      POSTGRES_PASSWORD: wetext_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wetext -d wetext"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:

